# On every push to main, ask each instance in instances.json to sync right away.
# Needs a fine-grained token with "Contents: read & write" on the instance repos, saved as
# secret INSTANCES_DISPATCH_TOKEN. Without it, instances still sync on their own hourly schedule.
name: Notify instances
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch metis-template-updated
        env:
          TOKEN: ${{ secrets.INSTANCES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No INSTANCES_DISPATCH_TOKEN: instances will pick this up on their hourly sync."; exit 0; fi
          for repo in $(jq -r '.[]' instances.json); do
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/dispatches" -d '{"event_type":"metis-template-updated"}' && echo "notified $repo"
          done
