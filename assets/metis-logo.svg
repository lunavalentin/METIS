    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="26.5" stroke="url(#g)" stroke-width="4.5" opacity=".5"/>
  <circle cx="28" cy="36" r="16" stroke="url(#g)" stroke-width="4.5"/>
  <circle cx="24.5" cy="39.5" r="6.5" fill="url(#g)"/>
